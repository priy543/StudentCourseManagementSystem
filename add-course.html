<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Course - Student Course Management System</title>

<link rel="stylesheet" href="style.css">

<style>

.form-container{
    max-width:800px;
    margin:40px auto;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    box-sizing:border-box;
}

.form-group textarea{
    height:120px;
    resize:none;
}

.submit-btn{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.submit-btn:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo">🎓 SCMS Admin</div>

<ul class="nav-links">
<li><a href="admin-dashboard.html">Dashboard</a></li>
<li><a href="add-course.html">Add Course</a></li>
<li><a href="edit-course.html">Manage Courses</a></li>
<li><a href="login.html">Logout</a></li>
</ul>

</nav>

<section class="hero">

<h1>Add New Course</h1>

<p>
Create and publish a new course for students.
</p>

</section>

<div class="form-container">

<form onsubmit="addCourse(event)">

<div class="form-group">
<label>Course Name</label>
<input
type="text"
id="courseName"
placeholder="Enter Course Name"
required>
</div>

<div class="form-group">
<label>Instructor Name</label>
<input
type="text"
id="instructor"
placeholder="Enter Instructor Name"
required>
</div>

<div class="form-group">
<label>Course Duration</label>
<input
type="text"
id="duration"
placeholder="e.g. 12 Weeks"
required>
</div>

<div class="form-group">
<label>Course Category</label>

<select
id="category"
required>

<option value="">Select Category</option>
<option>Artificial Intelligence</option>
<option>Programming</option>
<option>Web Development</option>
<option>Data Science</option>
<option>Cyber Security</option>
<option>Cloud Computing</option>

</select>

</div>

<div class="form-group">

<label>Course Description</label>

<textarea
id="description"
placeholder="Enter Course Description"
required></textarea>

</div>

<button
type="submit"
class="submit-btn">

➕ Add Course

</button>

</form>

</div>

<footer class="footer">

<h3>Student Course Management System</h3>

<p>Administrator Portal</p>

<p>© 2026 All Rights Reserved</p>

</footer>

<!-- Link JavaScript Validation -->
<script src="js/state.js"></script>

<script src="js/navigation.js"></script>

<script src="js/validation.js"></script>

<script src="js/app.js"></script>

</body>

</html>
